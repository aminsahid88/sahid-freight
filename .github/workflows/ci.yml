name: CI

on:
  push:
    branches: [backoffice, newmain]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: loadlink_admin
          POSTGRES_PASSWORD: LoadLink@2025#Secure
          POSTGRES_DB: loadlink_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U loadlink_admin -d loadlink_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      - name: Typecheck (all workspaces)
        run: npm run typecheck
      - name: Lint (web back-office pages)
        working-directory: apps/web
        run: npx eslint app/office lib/backoffice.ts lib/company.ts lib/useT.ts lib/useViewport.ts components/office
      - name: Test (api against Postgres service; core, i18n, extraction)
        run: npm test
      - name: Build API bundle
        working-directory: apps/api
        run: npm run build
      - name: Build web
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npx next build
