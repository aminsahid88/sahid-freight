version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: loadlink_db
    restart: always
    environment:
      POSTGRES_USER: loadlink_admin
      POSTGRES_PASSWORD: LoadLink@2025#Secure
      POSTGRES_DB: loadlink_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: loadlink_minio
    restart: always
    environment:
      MINIO_ROOT_USER: loadlink_admin
      MINIO_ROOT_PASSWORD: LoadLink@2025#Secure
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data: